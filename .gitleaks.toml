# gitleaks config — allowlist test fixture example data in spec docs.
#
# The `sk-ABCD1234EFGH` and similar strings in 02-architecture/TEST_SPEC.md
# are NFR-04 redaction test fixtures (documented test inputs), not real
# secrets. They appear inside markdown table cells describing what the
# NFR-04 redaction scanner asserts. Without this allowlist the secrets
# scanner reports them as leaks and the dimension score falls to 0.

[allowlist]
paths = [
  '''02-architecture/TEST_SPEC\.md$''',
  '''01-requirements/SRS\.md$''',
  '''01-requirements/TRACEABILITY_MATRIX\.md$''',
  '''03-development/tests/.*\.py$''',   # test fixtures may carry sentinel tokens
]
description = "NFR-04 redaction test fixture data — not real secrets"

# Regex allowlist: the specific sentinel `sk-ABCD1234EFGH` and `Bearer eyJ...`
# patterns used in NFR-04 spec rows.
regexes = [
  '''sk-ABCD1234EFGH''',
  '''Bearer eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+''',
  '''token=[A-Za-z0-9]{16,}''',
]
