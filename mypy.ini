[mypy]
# Project-root mypy config. Advance-phase runs `mypy . --ignore-missing-imports`
# from the repository root (see harness/cli/phase_cmds.py:2355), and a CWD
# config is what mypy honors for that call. The intent there is to type-check
# the project's src tree (per the "19 → mypy: type errors in src" code
# comment) but the actual call walks every .py under CWD, so without this
# config the run also walks:
#   - 03-development/tests/**  <- not src
#   - harness/**              <- vendored framework; out of project scope
#                                 per HR-17
#
# These settings mirror the working state of the prior pyproject.toml that
# Gate 1 documented (test_suite_run.py:35-37 cites
# `[tool.mypy] exclude = ["^harness/"]` as the project-side compensation for
# this same gap):
#   * exclude keeps harness/ + the project's own tests dir out of the walk,
#     so the duplicate "conftest" module that blocked mypy earlier cannot
#     recur (harness/tests/fixtures/mutmut_bare_cfg/03-development/tests/
#     conftest.py collides with 03-development/tests/conftest.py) and the
#     framework's internal mypy notes do not leak into the project's verdict.
#   * explicit_package_bases is belt-and-braces against any future fixture
#     under an overlapping path: mypy derives each module's package from
#     its on-disk directory, so two physically-separate conftest.py files
#     cannot be misinterpreted as one module even if exclude is bypassed.
explicit_package_bases = True
exclude = ^(harness/|03-development/tests/|03-development/\.mypy_cache/)
ignore_missing_imports = True
